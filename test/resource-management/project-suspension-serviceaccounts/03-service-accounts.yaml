# Two ServiceAccounts: one Active and one the customer set Inactive. The
# suspension must mark both and must leave spec.state alone, so lifting the
# suspension restores the customer's own choice.
apiVersion: iam.miloapis.com/v1alpha1
kind: ServiceAccount
metadata:
  name: robot-active
spec:
  state: Active
---
apiVersion: iam.miloapis.com/v1alpha1
kind: ServiceAccount
metadata:
  name: robot-inactive
spec:
  state: Inactive
