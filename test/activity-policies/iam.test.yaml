# iam.miloapis.com: groups, memberships, platform access, policy bindings,
# roles, service accounts, users and invitations.
policy_files:
- ../../config/services/activity/policies
tests:
- name: 'iam.miloapis.com-group: create names the object from the response'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: iam.miloapis.com
      resource: groups
      name: platform-admins
      namespace: organization-acme
    responseStatus:
      code: 201
    requestObject:
      metadata:
        name: platform-admins
    responseObject:
      metadata:
        name: platform-admins
  exp_rule: create
  exp_summary: alice@example.com created group platform-admins
  exp_change_source: human
  exp_links:
  - marker: platform-admins
    apiGroup: iam.miloapis.com
    kind: Group
    name: platform-admins
    namespace: organization-acme
- name: 'iam.miloapis.com-group: create without a response body uses objectRef'
