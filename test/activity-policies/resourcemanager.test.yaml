- name: 'resourcemanager.miloapis.com-organization: patch'
  audit:
    verb: patch
    user:
      username: alice@example.com
    objectRef:
      apiGroup: resourcemanager.miloapis.com
      resource: organizations
      name: acme
    responseStatus:
      code: 200
    requestObject:
      spec: {}
  exp_rule: update
  exp_summary: alice@example.com updated organization acme
  exp_change_source: human
- name: 'resourcemanager.miloapis.com-organization: a status update is not a user''s edit'
  policy: resourcemanager.miloapis.com-organization
  audit:
    verb: patch
    user:
      username: alice@example.com
    objectRef:
      apiGroup: resourcemanager.miloapis.com
      resource: organizations
      name: acme
      subresource: status
    responseStatus:
      code: 200
    requestObject:
      status: {}
  exp_no_match: true
- name: 'resourcemanager.miloapis.com-organizationmembership: add a user'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: resourcemanager.miloapis.com
      resource: organizationmemberships
      name: om-1
      namespace: organization-acme
