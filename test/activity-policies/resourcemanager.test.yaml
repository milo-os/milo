# resourcemanager.miloapis.com: organizations, memberships, projects and
# project suspensions.
policy_files:
- ../../config/services/activity/policies
tests:
- name: 'resourcemanager.miloapis.com-organization: create names the object from the response'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: resourcemanager.miloapis.com
      resource: organizations
      name: acme
    responseStatus:
      code: 201
    requestObject:
      metadata:
        name: acme
    responseObject:
      metadata:
        name: acme
  exp_rule: create
  exp_summary: alice@example.com created organization acme
  exp_change_source: human
  exp_links:
  - marker: acme
    apiGroup: resourcemanager.miloapis.com
    kind: Organization
    name: acme
- name: 'resourcemanager.miloapis.com-organization: create without a response body uses objectRef'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: resourcemanager.miloapis.com
      resource: organizations
      name: acme
    responseStatus:
      code: 201
    responseObject: {}
  exp_rule: create
  exp_summary: alice@example.com created organization acme
- name: 'resourcemanager.miloapis.com-organization: a rejected create is not an activity'
  policy: resourcemanager.miloapis.com-organization
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: resourcemanager.miloapis.com
      resource: organizations
      name: acme
    responseStatus:
      code: 409
    responseObject:
      kind: Status
      status: Failure
      code: 409
  exp_no_match: true
- name: 'resourcemanager.miloapis.com-organization: delete'
  audit:
    verb: delete
    user:
      username: alice@example.com
    objectRef:
      apiGroup: resourcemanager.miloapis.com
      resource: organizations
      name: acme
    responseStatus:
      code: 200
  exp_rule: delete
  exp_summary: alice@example.com deleted organization acme
- name: 'resourcemanager.miloapis.com-organization: reading is not an activity'
