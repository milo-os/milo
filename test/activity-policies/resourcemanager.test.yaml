      name: acme
    responseStatus:
      code: 200
  exp_no_match: true
- name: 'resourcemanager.miloapis.com-organization: a controller''s write is not an activity'
  policy: resourcemanager.miloapis.com-organization
  audit:
    verb: delete
    user:
      username: system:serviceaccount:milo-system:controller-manager
