        name: cgm-1
      spec: {}
  exp_rule: create-fallback
  exp_summary: alice@example.com added a contact to a group
- name: 'notification.miloapis.com-contactgroupmembership: remove a contact'
  audit:
    verb: delete
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contactgroupmemberships
      name: cgm-1
    responseStatus:
      code: 200
    responseObject:
