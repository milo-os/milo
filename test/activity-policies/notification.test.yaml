- name: 'notification.miloapis.com-email: send to an address'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: emails
      name: e-1
    responseStatus:
      code: 201
    requestObject:
      metadata:
        name: e-1
      spec:
        recipient:
          emailAddress: bob@example.com
          userRef:
            name: u-bob
  exp_rule: create-with-email-address
