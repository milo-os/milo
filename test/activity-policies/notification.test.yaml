# notification.miloapis.com: contacts, contact groups and their members,
# emails and email broadcasts.
policy_files:
- ../../config/services/activity/policies
tests:
- name: 'notification.miloapis.com-contact: create with an email'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      name: c-bob
    responseStatus:
      code: 201
    requestObject:
      metadata:
        name: c-bob
      spec:
        email: bob@example.com
  exp_rule: create-with-email
  exp_summary: alice@example.com created contact bob@example.com
- name: 'notification.miloapis.com-contact: create without an email'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      name: c-bob
    responseStatus:
      code: 201
    requestObject:
      metadata:
        name: c-bob
      spec: {}
  exp_rule: create-fallback
  exp_summary: alice@example.com created contact c-bob
- name: 'notification.miloapis.com-contact: delete'
  audit:
    verb: delete
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      name: c-bob
    responseStatus:
      code: 200
  exp_rule: delete
  exp_summary: alice@example.com deleted contact c-bob
- name: 'notification.miloapis.com-contact: reading is not an activity'
  policy: notification.miloapis.com-contact
  audit:
    verb: get
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      name: c-bob
    responseStatus:
      code: 200
  exp_no_match: true
- name: 'notification.miloapis.com-contact: a controller''s write is not an activity'
  policy: notification.miloapis.com-contact
  audit:
    verb: delete
    user:
      username: system:serviceaccount:milo-system:controller-manager
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      name: c-bob
    responseStatus:
      code: 200
  exp_no_match: true
- name: 'notification.miloapis.com-contact: patch'
  audit:
    verb: patch
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      name: c-bob
    responseStatus:
      code: 200
    requestObject:
      spec: {}
  exp_rule: update
  exp_summary: alice@example.com updated contact c-bob
  exp_change_source: human
- name: 'notification.miloapis.com-contact: a status update is not a user''s edit'
  policy: notification.miloapis.com-contact
  audit:
    verb: patch
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      name: c-bob
      subresource: status
    responseStatus:
      code: 200
    requestObject:
      status: {}
  exp_no_match: true
# Authorization refuses a create before the API server reads its body, so the
# event has no object name and no request body.
- name: 'notification.miloapis.com-contact: a refused create is not an activity'
  policy: notification.miloapis.com-contact
  audit:
    verb: create
    user:
      username: signup-form@example.identity.miloapis.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      namespace: milo-system
    requestURI: /apis/notification.miloapis.com/v1alpha1/namespaces/milo-system/contacts
    responseStatus:
      code: 403
  exp_no_match: true
- name: 'notification.miloapis.com-contact: a dry-run create is not an activity'
  policy: notification.miloapis.com-contact
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contacts
      name: c-bob
    requestURI: /apis/notification.miloapis.com/v1alpha1/namespaces/default/contacts?dryRun=All
    responseStatus:
      code: 201
    requestObject:
      metadata:
        name: c-bob
      spec:
        email: bob@example.com
  exp_no_match: true
- name: 'notification.miloapis.com-contactgroup: create with a display name'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contactgroups
      name: cg-1
    responseStatus:
      code: 201
    requestObject:
      metadata:
        name: cg-1
      spec:
        displayName: Billing alerts
  exp_rule: create-with-displayname
  exp_summary: alice@example.com created contact group Billing alerts
  exp_links:
  - marker: Billing alerts
    apiGroup: notification.miloapis.com
    kind: ContactGroup
    name: cg-1
- name: 'notification.miloapis.com-contactgroup: create without a display name'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
