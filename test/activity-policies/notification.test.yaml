- name: 'notification.miloapis.com-contactgroupmembership: add a contact'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contactgroupmemberships
      name: cgm-1
    responseStatus:
      code: 201
    requestObject:
      metadata:
        name: cgm-1
      spec: &id001
        contactRef:
          name: c-bob
        contactGroupRef:
          name: cg-1
  exp_rule: create-with-refs
  exp_summary: alice@example.com added c-bob to contact group cg-1
- name: 'notification.miloapis.com-contactgroupmembership: add without the references'
  audit:
    verb: create
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contactgroupmemberships
