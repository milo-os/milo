        name: cgm-1
      spec: *id001
  exp_rule: delete-with-refs
  exp_summary: alice@example.com removed c-bob from contact group cg-1
- name: 'notification.miloapis.com-contactgroupmembership: remove when the response has no spec'
  audit:
    verb: delete
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contactgroupmemberships
      name: cgm-1
    responseStatus:
      code: 200
    responseObject:
      kind: Status
      status: Success
  exp_rule: delete-fallback
  exp_summary: alice@example.com removed a contact from a group
- name: 'notification.miloapis.com-contactgroupmembership: reading is not an activity'
  policy: notification.miloapis.com-contactgroupmembership
  audit:
