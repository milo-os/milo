  policy: notification.miloapis.com-contactgroup
  audit:
    verb: get
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contactgroups
      name: cg-1
    responseStatus:
      code: 200
  exp_no_match: true
- name: 'notification.miloapis.com-contactgroup: a controller''s write is not an activity'
  policy: notification.miloapis.com-contactgroup
  audit:
    verb: delete
    user:
      username: system:serviceaccount:milo-system:controller-manager
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contactgroups
      name: cg-1
    responseStatus:
      code: 200
  exp_no_match: true
- name: 'notification.miloapis.com-contactgroup: patch'
  audit:
    verb: patch
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
      resource: contactgroups
      name: cg-1
    responseStatus:
      code: 200
    requestObject:
