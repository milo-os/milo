  exp_rule: update
  exp_summary: alice@example.com updated contact group cg-1
  exp_change_source: human
- name: 'notification.miloapis.com-contactgroup: a status update is not a user''s edit'
  policy: notification.miloapis.com-contactgroup
  audit:
    verb: patch
    user:
      username: alice@example.com
    objectRef:
      apiGroup: notification.miloapis.com
