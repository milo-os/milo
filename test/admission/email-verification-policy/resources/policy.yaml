# Test copy of the deny-unverified-email policy that ships in the datum repo at
# config/services/iam.miloapis.com/validation/unverified-email-policy.yaml.
#
# Two deliberate differences from what ships:
#
#  1. Named test-deny-unverified-email, so applying it in a cluster that already
#     carries the real one does not collide.
#  2. validationActions is [Deny], not [Warn, Audit]. Under Warn a broken
#     expression would not fail the write and this test would pass vacuously.
#
# The expression itself must stay character-for-character identical to the
# shipped one. If they drift, this test stops testing the thing that deploys.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "test-deny-unverified-email"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
  validations:
    # MUST NOT start with "(" — chainsaw treats a value that opens with "(" and
    # closes with ")" as a JMESPath expression and tries to evaluate it, which
    # fails as `SyntaxError: Unexpected token at the end of the expression:
    # TOKRparen`. The leading "!" is what keeps this a literal string. Do not
    # "tidy" the first clause back into parentheses.
    - expression: >-
        !has(request.userInfo.extra) ||
        !('iam.miloapis.com/emailVerified' in request.userInfo.extra) ||
        request.userInfo.extra['iam.miloapis.com/emailVerified'][0] == 'true' ||
        request.resource.group == 'authorization.k8s.io' ||
        (oldObject != null && has(oldObject.metadata.deletionTimestamp))
      message: "Email address is not verified. Verify your email address before creating or modifying resources."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "test-deny-unverified-email"
spec:
  policyName: "test-deny-unverified-email"
  validationActions: [Deny]
