# The role the bindings grant, in the assignable-roles namespace, and the User
# they grant it to.
apiVersion: v1
kind: Namespace
metadata:
  name: datum-cloud
---
apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: pbo-viewer
  namespace: datum-cloud
spec:
  launchStage: Stable
---
apiVersion: iam.miloapis.com/v1alpha1
kind: User
metadata:
  name: pbo-user
  labels:
    test.miloapis.com/scenario: "policybinding-project-owner-gc"
spec:
  email: policybinding-owner-user@test.local
  givenName: PolicyBinding
  familyName: Owner
