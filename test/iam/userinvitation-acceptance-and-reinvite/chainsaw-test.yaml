apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: userinvitation-acceptance-and-reinvite
spec:
  description: |
    End-to-end regression tests for GitHub issue #802, which had two defects:

    1. Accepting an invitation after its expiration silently did nothing:
       spec.state was recorded as Accepted, but no membership was granted and
       no error was raised, leaving a dead "Accepted" + Expired record.
    2. Any existing invitation (expired, declined, or accepted-too-late) counted
       as a duplicate, so re-inviting a person after the first invitation went
       terminal failed with `spec.organizationRef: Duplicate value`.

    The fix makes the validating webhook reject an acceptance (Pending ->
    Accepted) once the invitation has expired, and relaxes the create-time
    duplicate check so only a live, still-pending invitation blocks a re-invite.

    This suite verifies the test plan for #802:
    - Scenario A: accepting an expired invitation is rejected; the object is
      left untouched as Pending.
    - Scenario B: after an invitation expires, re-inviting the same email and
      organization succeeds (the expired record no longer counts as a duplicate).
    - Scenario C: after an invitation is declined, re-inviting the same email
      and organization succeeds.
    - Scenario D: while an invitation is live and pending, a duplicate
      invitation for the same email and organization is still rejected.

  steps:
  - name: setup-prerequisites
    description: |
      Create the shared Role and EmailTemplate fixtures in milo-system that the
      UserInvitation webhook and controller require, then create each test
      Organization (and its namespace) and invitee User.
    try:
    - description: Create role and email template fixtures in milo-system
      script:
        timeout: 30s
        content: |
          cat <<'FIXTURES' | kubectl apply -f -
          apiVersion: iam.miloapis.com/v1alpha1
          kind: Role
          metadata:
            name: resourcemanager.miloapis.com-organization-viewer
            namespace: milo-system
          spec:
            launchStage: Beta
            includedPermissions:
            - resourcemanager.miloapis.com/organizations.get
          ---
          apiVersion: notification.miloapis.com/v1alpha1
          kind: EmailTemplate
          metadata:
            name: emailtemplates.notification.miloapis.com-userinvitationemailtemplate
            namespace: milo-system
          spec:
            subject: "You have been invited"
            textBody: "You have been invited to join an organization."
            htmlBody: "<p>You have been invited.</p>"
            variables:
            - name: OrganizationDisplayName
              required: false
              type: string
            - name: UserInvitationName
              required: false
              type: string
            - name: InviterDisplayName
              required: false
              type: string
          FIXTURES
    - apply:
        file: 01-ex-org.yaml
    - apply:
        file: 04-dc-org.yaml
    - apply:
        file: 09-lp-org.yaml
    - wait:
        apiVersion: v1
        kind: Namespace
        name: organization-ui-ex-test-org
        timeout: 30s
        for:
          jsonPath:
            path: '{.status.phase}'
            value: Active
    - wait:
        apiVersion: v1
        kind: Namespace
        name: organization-ui-dc-test-org
        timeout: 30s
        for:
          jsonPath:
            path: '{.status.phase}'
            value: Active
    - wait:
        apiVersion: v1
        kind: Namespace
        name: organization-ui-lp-test-org
        timeout: 30s
        for:
          jsonPath:
            path: '{.status.phase}'
            value: Active
    - apply:
        file: 02-ex-invitee.yaml
    - apply:
        file: 05-dc-invitee.yaml
    - apply:
        file: 10-lp-invitee.yaml
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: User
        name: ui-ex-invitee
        timeout: 30s
        for:
          condition:
            name: Ready
            value: 'True'
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: User
        name: ui-dc-invitee
        timeout: 30s
        for:
          condition:
            name: Ready
            value: 'True'
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: User
        name: ui-lp-invitee
        timeout: 30s
        for:
          condition:
            name: Ready
            value: 'True'

  # ---------------------------------------------------------------------------
  # Scenario A: accepting an expired invitation is rejected.
  # The validating webhook refuses an expirationDate in the past, so the test
  # creates a live invitation with a near-future expirationDate, waits for the
  # wall clock to pass it, then attempts the acceptance update.
  # ---------------------------------------------------------------------------
  - name: accept-after-expiry-is-rejected
    description: |
      Issue #802 defect 1. After a UserInvitation lapses, an acceptance
      (Pending -> Accepted) must be rejected at admission, the message must
      mention the expiration, and the object must remain Pending.
    try:
    - description: Create a UserInvitation that expires a few seconds in the future
      script:
        timeout: 30s
        content: |
          set -eu
          NS="organization-ui-ex-test-org"
          NAME="ui-ex-test-invite"
          # The admission webhook rejects an expirationDate in the past, so the
          # invitation starts live (expiration now + 10s) and lapses during the test.
          NOW=$(date +%s)
          EXP_EPOCH=$(( NOW + 10 ))
          if date -u -d "@$EXP_EPOCH" +%Y-%m-%dT%H:%M:%SZ >/dev/null 2>&1; then
            EXPIRATION=$(date -u -d "@$EXP_EPOCH" +%Y-%m-%dT%H:%M:%SZ)
          else
            EXPIRATION=$(date -u -r "$EXP_EPOCH" +%Y-%m-%dT%H:%M:%SZ)
          fi
          cat <<EOF | kubectl apply -f -
          apiVersion: iam.miloapis.com/v1alpha1
          kind: UserInvitation
          metadata:
            name: $NAME
            namespace: $NS
          spec:
            organizationRef:
              name: ui-ex-test-org
            email: invitee@ui-ex-test.local
            givenName: Invitee
            familyName: User
            roles:
            - name: resourcemanager.miloapis.com-organization-viewer
              namespace: milo-system
            state: Pending
            expirationDate: "$EXPIRATION"
          EOF
    - description: Wait for the invitation to be processed while live
      wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: UserInvitation
        name: ui-ex-test-invite
        namespace: organization-ui-ex-test-org
        timeout: 60s
        for:
          condition:
            name: Pending
            value: 'True'
    - description: Wait for the invitation to lapse past its expiration
      script:
        timeout: 60s
        content: |
          set -eu
          # Independent of the create step, wait long enough that the wall clock
          # has definitely passed the +10s expiration from the create step.
          NOW=$(date +%s)
          LAPSE_EPOCH=$(( NOW + 12 ))
          while [ "$(date +%s)" -lt "$LAPSE_EPOCH" ]; do sleep 1; done
          echo "Wall clock has passed the invitation expiration."
    - description: Accepting the expired invitation is rejected at admission
      script:
        timeout: 30s
        content: |
          set -eu
          NS="organization-ui-ex-test-org"
          NAME="ui-ex-test-invite"
          if OUT=$(kubectl patch userinvitation "$NAME" -n "$NS" --type=merge \
                -p '{"spec":{"state":"Accepted"}}' 2>&1); then
            echo "FAIL: accepting an expired invitation unexpectedly succeeded"
            exit 1
          fi
          echo "Admission rejection: $OUT"
          echo "$OUT" | grep -qi "expired" \
            || { echo "FAIL: rejection message did not mention expiration"; echo "$OUT"; exit 1; }
          STATE=$(kubectl get userinvitation "$NAME" -n "$NS" -o jsonpath='{.spec.state}')
          test "$STATE" = "Pending" \
            || { echo "FAIL: invitation state after rejected accept = $STATE, want Pending"; exit 1; }
          echo "PASS: expired invitation acceptance rejected; object remains Pending"
    - description: The originally-sent invitation email still exists for the invitee
      script:
        timeout: 30s
        content: |
          set -eu
          NS="organization-ui-ex-test-org"
          INVITE_NAME="ui-ex-test-invite"
          EXPECTED_TO="invitee@ui-ex-test.local"
          # The invitation was live when created, so the controller produced an
          # Email before the expiration passed; the Email is retained afterward.
          UUID=$(kubectl get userinvitation "$INVITE_NAME" -n "$NS" -o jsonpath='{.metadata.uid}')
          EMAIL_NAME="${UUID}-user-invitation"
          TO=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.recipient.emailAddress}')
          test "$TO" = "$EXPECTED_TO" \
            || { echo "FAIL: email $EMAIL_NAME recipient = $TO, want $EXPECTED_TO"; exit 1; }
          TEMPLATE=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.templateRef.name}')
          test "$TEMPLATE" = "emailtemplates.notification.miloapis.com-userinvitationemailtemplate" \
            || { echo "FAIL: email $EMAIL_NAME template = $TEMPLATE"; exit 1; }
          echo "PASS: original invitation email $EMAIL_NAME exists for $EXPECTED_TO with template $TEMPLATE"

  # ---------------------------------------------------------------------------
  # Scenario B: an expired invitation no longer blocks a re-invite.
  # ---------------------------------------------------------------------------
  - name: expired-invitation-does-not-block-reinvite
    description: |
      Issue #802 defect 2. The expired UserInvitation from Scenario A is retained
      but must not count as a duplicate. Creating a fresh invitation for the same
      email and organization succeeds.
    try:
    - apply:
        file: 03-ex-reinvite.yaml
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: UserInvitation
        name: ui-ex-test-reinvite
        namespace: organization-ui-ex-test-org
        timeout: 60s
        for:
          condition:
            name: Pending
            value: 'True'
    - description: The re-invite produced an invitation email to the invitee
      script:
        timeout: 30s
        content: |
          set -eu
          NS="organization-ui-ex-test-org"
          INVITE_NAME="ui-ex-test-reinvite"
          EXPECTED_TO="invitee@ui-ex-test.local"
          # The controller creates the Email in the invitation's namespace with
          # the deterministic name "<UserInvitation UID>-user-invitation".
          UUID=$(kubectl get userinvitation "$INVITE_NAME" -n "$NS" -o jsonpath='{.metadata.uid}')
          EMAIL_NAME="${UUID}-user-invitation"
          TO=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.recipient.emailAddress}')
          test "$TO" = "$EXPECTED_TO" \
            || { echo "FAIL: email $EMAIL_NAME recipient = $TO, want $EXPECTED_TO"; exit 1; }
          TEMPLATE=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.templateRef.name}')
          test "$TEMPLATE" = "emailtemplates.notification.miloapis.com-userinvitationemailtemplate" \
            || { echo "FAIL: email $EMAIL_NAME template = $TEMPLATE"; exit 1; }
          echo "PASS: re-invite email $EMAIL_NAME created for $EXPECTED_TO with template $TEMPLATE"

  # ---------------------------------------------------------------------------
  # Scenario C: a declined invitation no longer blocks a re-invite.
  # ---------------------------------------------------------------------------
  - name: declined-invitation-does-not-block-reinvite
    description: |
      Issue #802 defect 2. A declined UserInvitation is terminal and must not
      count as a duplicate. Creating a fresh invitation for the same email and
      organization after a decline succeeds.
    try:
    - apply:
        file: 06-dc-invitation.yaml
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: UserInvitation
        name: ui-dc-test-invite
        namespace: organization-ui-dc-test-org
        timeout: 60s
        for:
          condition:
            name: Pending
            value: 'True'
    - apply:
        file: 07-dc-invitation-declined.yaml
    - assert:
        resource:
          apiVersion: iam.miloapis.com/v1alpha1
          kind: UserInvitation
          metadata:
            name: ui-dc-test-invite
            namespace: organization-ui-dc-test-org
          spec:
            state: Declined
    - apply:
        file: 08-dc-reinvite.yaml
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: UserInvitation
        name: ui-dc-test-reinvite
        namespace: organization-ui-dc-test-org
        timeout: 60s
        for:
          condition:
            name: Pending
            value: 'True'
    - description: The post-decline re-invite produced an invitation email to the invitee
      script:
        timeout: 30s
        content: |
          set -eu
          NS="organization-ui-dc-test-org"
          INVITE_NAME="ui-dc-test-reinvite"
          EXPECTED_TO="invitee@ui-dc-test.local"
          UUID=$(kubectl get userinvitation "$INVITE_NAME" -n "$NS" -o jsonpath='{.metadata.uid}')
          EMAIL_NAME="${UUID}-user-invitation"
          TO=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.recipient.emailAddress}')
          test "$TO" = "$EXPECTED_TO" \
            || { echo "FAIL: email $EMAIL_NAME recipient = $TO, want $EXPECTED_TO"; exit 1; }
          TEMPLATE=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.templateRef.name}')
          test "$TEMPLATE" = "emailtemplates.notification.miloapis.com-userinvitationemailtemplate" \
            || { echo "FAIL: email $EMAIL_NAME template = $TEMPLATE"; exit 1; }
          echo "PASS: post-decline re-invite email $EMAIL_NAME created for $EXPECTED_TO with template $TEMPLATE"

  # ---------------------------------------------------------------------------
  # Scenario D: a live pending invitation still blocks a duplicate re-invite.
  # ---------------------------------------------------------------------------
  - name: live-pending-invitation-blocks-reinvite
    description: |
      Issue #802 constraint. Only a live (not expired), still-pending invitation
      may block a re-invite. Creating a second invitation for the same email and
      organization while the first is live and pending must be rejected, and only
      the original invitation may remain.
    try:
    - apply:
        file: 11-lp-invitation.yaml
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: UserInvitation
        name: ui-lp-test-invite
        namespace: organization-ui-lp-test-org
        timeout: 60s
        for:
          condition:
            name: Pending
            value: 'True'
    - description: The live pending invitation produced an invitation email to the invitee
      script:
        timeout: 30s
        content: |
          set -eu
          NS="organization-ui-lp-test-org"
          INVITE_NAME="ui-lp-test-invite"
          EXPECTED_TO="invitee@ui-lp-test.local"
          UUID=$(kubectl get userinvitation "$INVITE_NAME" -n "$NS" -o jsonpath='{.metadata.uid}')
          EMAIL_NAME="${UUID}-user-invitation"
          TO=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.recipient.emailAddress}')
          test "$TO" = "$EXPECTED_TO" \
            || { echo "FAIL: email $EMAIL_NAME recipient = $TO, want $EXPECTED_TO"; exit 1; }
          TEMPLATE=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.templateRef.name}')
          test "$TEMPLATE" = "emailtemplates.notification.miloapis.com-userinvitationemailtemplate" \
            || { echo "FAIL: email $EMAIL_NAME template = $TEMPLATE"; exit 1; }
          echo "PASS: live pending email $EMAIL_NAME created for $EXPECTED_TO with template $TEMPLATE"
    - apply:
        file: 12-lp-invitation-duplicate.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'Duplicate value')): true
    - description: Only the original live invitation exists
      script:
        timeout: 30s
        content: |
          set -eu
          COUNT=$(kubectl get userinvitation -n organization-ui-lp-test-org -o json \
            | jq '[.items[].metadata.name] | length')
          echo "UserInvitations in organization-ui-lp-test-org: $COUNT"
          test "$COUNT" -eq 1 \
            || { echo "FAIL: expected 1 invitation, got $COUNT"; exit 1; }
          echo "PASS: duplicate live invitation rejected; only the original remains"

  # ---------------------------------------------------------------------------
  # Scenario E: accepting a live invitation grants the membership and removes
  # the invitation.
  # This covers the positive half of defect 1 (an acceptance must grant the
  # membership the invitee requested — not silently do nothing). The "accepted"
  # leg of defect 2 is covered by Scenario A: the webhook now rejects an
  # acceptance once the invitation has expired, so a dead "Accepted" record can
  # no longer be created to block re-invites. Re-inviting after a live
  # acceptance is not applicable because the invitee becomes an organization
  # member, and the webhook rejects inviting an existing member.
  # ---------------------------------------------------------------------------
  - name: accepted-invitation-grants-membership-and-is-removed
    description: |
      Issue #802 defect 1. Accepting a live invitation grants the requested
      OrganizationMembership (defect 1: acceptance must not silently do nothing)
      and removes the accepted invitation.
    try:
    - apply:
        file: 13-acc-org.yaml
    - wait:
        apiVersion: v1
        kind: Namespace
        name: organization-ui-acc-test-org
        timeout: 30s
        for:
          jsonPath:
            path: '{.status.phase}'
            value: Active
    - apply:
        file: 14-acc-invitee.yaml
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: User
        name: ui-acc-invitee
        timeout: 30s
        for:
          condition:
            name: Ready
            value: 'True'
    - apply:
        file: 15-acc-invitation.yaml
    - wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: UserInvitation
        name: ui-acc-test-invite
        namespace: organization-ui-acc-test-org
        timeout: 60s
        for:
          condition:
            name: Pending
            value: 'True'
    - description: The invitation produced an email to the invitee
      script:
        timeout: 30s
        content: |
          set -eu
          NS="organization-ui-acc-test-org"
          INVITE_NAME="ui-acc-test-invite"
          EXPECTED_TO="invitee@ui-acc-test.local"
          UUID=$(kubectl get userinvitation "$INVITE_NAME" -n "$NS" -o jsonpath='{.metadata.uid}')
          EMAIL_NAME="${UUID}-user-invitation"
          TO=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.recipient.emailAddress}')
          test "$TO" = "$EXPECTED_TO" \
            || { echo "FAIL: email $EMAIL_NAME recipient = $TO, want $EXPECTED_TO"; exit 1; }
          TEMPLATE=$(kubectl get email "$EMAIL_NAME" -n "$NS" -o jsonpath='{.spec.templateRef.name}')
          test "$TEMPLATE" = "emailtemplates.notification.miloapis.com-userinvitationemailtemplate" \
            || { echo "FAIL: email $EMAIL_NAME template = $TEMPLATE"; exit 1; }
          echo "PASS: invitation email $EMAIL_NAME exists for $EXPECTED_TO with template $TEMPLATE"
    - description: Accept the live invitation
      script:
        timeout: 30s
        content: |
          set -eu
          NS="organization-ui-acc-test-org"
          NAME="ui-acc-test-invite"
          if ! OUT=$(kubectl patch userinvitation "$NAME" -n "$NS" --type=merge \
                -p '{"spec":{"state":"Accepted"}}' 2>&1); then
            echo "FAIL: accepting a live invitation failed: $OUT"
            exit 1
          fi
          echo "Acceptance accepted: $OUT"
    - description: The accepted invitation is removed after membership is granted
      wait:
        apiVersion: iam.miloapis.com/v1alpha1
        kind: UserInvitation
        name: ui-acc-test-invite
        namespace: organization-ui-acc-test-org
        timeout: 60s
        for:
          deletion: {}
    - assert:
        resource:
          apiVersion: resourcemanager.miloapis.com/v1alpha1
          kind: OrganizationMembership
          metadata:
            name: member-ui-acc-invitee
            namespace: organization-ui-acc-test-org
          spec:
            organizationRef:
              name: ui-acc-test-org
            userRef:
              name: ui-acc-invitee
