apiVersion: iam.miloapis.com/v1alpha1
kind: PolicyBinding
metadata:
  name: pb-valid
  namespace: organization-pb-org-a
  labels:
    test.miloapis.com/scenario: "policybinding-org-restrictions"
spec:
  roleRef:
    name: some-role
    namespace: organization-pb-org-a
  # The ServiceAccount subject carries a static uid. The mutating webhook leaves
  # subjects with a uid untouched (it cannot resolve project-local ServiceAccounts
  # through the root client), and the validating webhook confirms the
  # ServiceAccount lives in the target Project's control plane by name.
  subjects:
    - kind: ServiceAccount
      name: pb-robot-a
      uid: 11111111-1111-1111-1111-111111111111
  # The target Project's uid is required by the schema but admission validation
  # never matches it against the Project: the org-containment check uses the
  # Project's organization-name label looked up by name.
  resourceSelector:
    resourceRef:
      apiGroup: resourcemanager.miloapis.com
      kind: Project
      name: pb-project-a
      uid: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
