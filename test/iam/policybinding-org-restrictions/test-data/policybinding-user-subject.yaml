apiVersion: iam.miloapis.com/v1alpha1
kind: PolicyBinding
metadata:
  name: pb-user-subject
  namespace: organization-pb-org-a
  labels:
    test.miloapis.com/scenario: "policybinding-org-restrictions"
spec:
  roleRef:
    name: some-role
    namespace: datum-cloud
  # A User subject is allowed in organization context: the org-containment
  # checks (namespace + in-org Project target) keep the grant inside the org,
  # so the subject kind is unrestricted.
  subjects:
    - kind: User
      name: pb-user
  resourceSelector:
    resourceRef:
      apiGroup: resourcemanager.miloapis.com
      kind: Project
      name: pb-project-a
      uid: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
