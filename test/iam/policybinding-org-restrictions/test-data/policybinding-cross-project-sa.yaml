apiVersion: iam.miloapis.com/v1alpha1
kind: PolicyBinding
metadata:
  name: pb-cross-project-sa
  namespace: organization-pb-org-a
  labels:
    test.miloapis.com/scenario: "policybinding-org-restrictions"
spec:
  roleRef:
    name: some-role
    namespace: organization-pb-org-a
  # The target Project (pb-project-a) belongs to Organization A, but the subject
  # ServiceAccount (pb-robot-b) lives in pb-project-b's control plane. The
  # project-scoped read of the subject through pb-project-a's control plane must
  # fail, denying the binding.
  subjects:
    - kind: ServiceAccount
      name: pb-robot-b
      uid: 22222222-2222-2222-2222-222222222222
  resourceSelector:
    resourceRef:
      apiGroup: resourcemanager.miloapis.com
      kind: Project
      name: pb-project-a
      uid: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
