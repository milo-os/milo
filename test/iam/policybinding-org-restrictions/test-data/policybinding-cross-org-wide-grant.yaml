apiVersion: iam.miloapis.com/v1alpha1
kind: PolicyBinding
metadata:
  name: pb-cross-org-wide-grant
  namespace: organization-pb-org-a
  labels:
    test.miloapis.com/scenario: "policybinding-org-restrictions"
spec:
  roleRef:
    name: some-role
    namespace: datum-cloud
  # An organization-wide grant targeting a different Organization must be denied:
  # the webhook checks that the referenced organization's name matches the
  # request organization, closing the cross-tenant escalation where an org-A
  # holder could grant a role across all of org-B.
  subjects:
    - kind: User
      name: pb-user
  resourceSelector:
    resourceRef:
      apiGroup: resourcemanager.miloapis.com
      kind: Organization
      name: pb-org-b
      uid: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
