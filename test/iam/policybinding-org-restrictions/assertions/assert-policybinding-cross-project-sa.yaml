apiVersion: iam.miloapis.com/v1alpha1
kind: PolicyBinding
metadata:
  name: pb-cross-project-sa
  namespace: organization-pb-org-a
spec:
  roleRef:
    name: some-role
    namespace: organization-pb-org-a
  # The ServiceAccount subject lives in a different project's control plane
  # than the target, but the binding is accepted: an organization admin may
  # grant a ServiceAccount access outside of its own project.
  subjects:
    - kind: ServiceAccount
      name: pb-robot-b
      uid: 22222222-2222-2222-2222-222222222222
  resourceSelector:
    resourceRef:
      apiGroup: resourcemanager.miloapis.com
      kind: Project
      name: pb-project-a
      uid: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
