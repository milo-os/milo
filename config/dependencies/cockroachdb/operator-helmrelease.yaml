# The CockroachDB operator. It installs its CrdbCluster and CrdbNode CRDs when it starts.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cockroachdb-operator
spec:
  interval: 10m
  chart:
    spec:
      chart: cockroachdb-operator-chart
      version: "1.1.0"
      sourceRef:
        kind: HelmRepository
        name: cockroachdb
      interval: 5m
  values:
    numReplicas: 1
    # Must match the region code of the cluster below.
    cloudRegion: local
