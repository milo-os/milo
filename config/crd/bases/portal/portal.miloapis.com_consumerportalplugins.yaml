---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
    discovery.miloapis.com/parent-contexts: Platform
  name: consumerportalplugins.portal.miloapis.com
spec:
  group: portal.miloapis.com
  names:
    kind: ConsumerPortalPlugin
    listKind: ConsumerPortalPluginList
    plural: consumerportalplugins
    singular: consumerportalplugin
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.slug
      name: Slug
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConsumerPortalPlugin registers a service's portal plugin for cloud-portal,
          the customer-facing portal. Service teams do not create these directly —
          they are fanned out by the services-operator from a ServiceConfiguration's
          spec.userInterface.consumer block.

          ### How It Works
          - A service team sets spec.userInterface.consumer on their ServiceConfiguration
          - The services-operator fans that out into a ConsumerPortalPlugin here
          - cloud-portal watches ConsumerPortalPlugin, fetches the manifest at
            spec.assets, and writes back Status reporting what it found
          - Extensions declared in the manifest (portal.nav/project, portal.page/project,
            portal.card/project-home) render inside a project, gated by spec.visibility
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConsumerPortalPluginSpec defines the desired state of ConsumerPortalPlugin.
            properties:
              assets:
                description: Assets locates the plugin's built Module Federation bundle.
                properties:
                  baseURL:
                    description: |-
                      BaseURL is the HTTPS origin, operated by the service team, serving the
                      plugin's built assets (remoteEntry.js, chunks, and the manifest at
                      ManifestPath).
                    pattern: ^https://
                    type: string
                  caBundle:
                    description: |-
                      CABundle is an optional PEM-encoded CA certificate bundle for an
                      internal CA fronting BaseURL. Server-side only — never sent to the
                      browser.
                    type: string
                  manifestPath:
                    default: /plugin-manifest.json
                    description: |-
                      ManifestPath is the path to plugin-manifest.json under BaseURL.
                      Defaults to "/plugin-manifest.json".
                    type: string
                required:
                - baseURL
                type: object
              deprecated:
                description: |-
                  Deprecated marks the winning ServiceConfiguration as deprecated. The
                  portal may use this to warn operators without hiding the plugin.
                type: boolean
              displayName:
                description: |-
                  DisplayName is the human-readable name shown in the portal UI (e.g. a
                  "dev plugin" badge, error states).
                type: string
              slug:
                description: |-
                  Slug is the unique DNS label identifying this plugin. It is the URL
                  segment and the same-origin asset-proxy segment
                  (/api/plugins/<slug>/...). Immutable after creation.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              suspend:
                description: |-
                  Suspend is a platform-operator kill switch. A suspended plugin is
                  never served, regardless of manifest health.
                type: boolean
              visibility:
                description: Visibility gates whether a project sees this plugin's
                  extensions.
                properties:
                  entitlement:
                    description: Entitlement controls project-level gating. See PluginEntitlementRequirement.
                    enum:
                    - Required
                    - None
                    type: string
                  featureFlag:
                    description: |-
                      FeatureFlag, when set, additionally gates visibility on an OpenFeature
                      flag key evaluated by cloud-portal.
                    type: string
                required:
                - entitlement
                type: object
            required:
            - assets
            - displayName
            - slug
            - visibility
            type: object
          status:
            description: |-
              ConsumerPortalPluginStatus reports the portal's most recent manifest
              resolution for this plugin. Written by cloud-portal (the consuming
              host), not by the services-operator that writes Spec.
            properties:
              conditions:
                description: |-
                  Conditions communicate manifest health. See PluginDiscovered,
                  PluginCompatible, PluginReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              manifest:
                description: |-
                  Manifest is a snapshot of the most recently resolved manifest, when
                  discovery has succeeded at least once.
                properties:
                  digest:
                    description: Digest is a "sha256:..." digest of the fetched manifest
                      bytes.
                    type: string
                  extensions:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: 'Extensions counts declared extensions by type, e.g.
                      {"portal.nav/project": 1}.'
                    type: object
                  fetchedAt:
                    description: FetchedAt is when the portal last fetched this manifest.
                    format: date-time
                    type: string
                  sdkRange:
                    description: SDKRange is the manifest's declared sdk.range.
                    type: string
                  version:
                    description: Version is the manifest's own declared version.
                    type: string
                required:
                - digest
                - fetchedAt
                - sdkRange
                - version
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent spec generation the writing
                  portal has processed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.slug is immutable
          rule: '!has(oldSelf.spec.slug) || self.spec.slug == oldSelf.spec.slug'
    selectableFields:
    - jsonPath: .spec.slug
    served: true
    storage: true
    subresources:
      status: {}
