---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    discovery.miloapis.com/parent-contexts: Organization
  name: organizationdomains.resourcemanager.miloapis.com
spec:
  group: resourcemanager.miloapis.com
  names:
    kind: OrganizationDomain
    listKind: OrganizationDomainList
    plural: organizationdomains
    singular: organizationdomain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.domainName
      name: Domain
      type: string
    - jsonPath: .status.conditions[?(@.type=='Verified')].status
      name: Verified
      type: string
    - jsonPath: .status.verification.dnsRecord.name
      name: Record
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "OrganizationDomain proves that an organization controls a domain
          name, such\nas the domain of its company's email addresses. It belongs to
          the\norganization rather than to one of its projects, so the domain doesn't
          have\nto be added to a project to be used.\n\nMilo publishes a DNS TXT record
          in status.verification.dnsRecord. Once the\nrecord is found at the domain,
          the Verified condition becomes True and stays\nTrue. The record can then
          be removed.\n\nThe resource is named after its domain, so an organization
          has at most one\nfor each domain. Verified domains, and their subdomains,
          can be used for\nemail domain joining.\n\nExample:\n\n\tapiVersion: resourcemanager.miloapis.com/v1alpha1\n\tkind:
          OrganizationDomain\n\tmetadata:\n\t  name: acme.com\n\t  namespace: organization-acme-corp\n\tspec:\n\t
          \ domainName: acme.com"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OrganizationDomainSpec defines the domain an organization
              wants to verify.
            properties:
              domainName:
                description: |-
                  DomainName is the domain to verify, in lower case, such as acme.com or
                  eu.acme.com. It must match metadata.name and can't be changed.
                maxLength: 253
                minLength: 3
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                type: string
                x-kubernetes-validations:
                - message: domainName is immutable
                  rule: self == oldSelf
            required:
            - domainName
            type: object
          status:
            description: OrganizationDomainStatus reports how verification is going.
            properties:
              conditions:
                default:
                - lastTransitionTime: "1970-01-01T00:00:00Z"
                  message: Waiting for the control plane to publish a verification
                    record
                  reason: Pending
                  status: Unknown
                  type: Verified
                description: Conditions holds the Verified condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              verification:
                description: |-
                  Verification holds the DNS record to add to the domain. It is cleared
                  once the domain is verified.
                properties:
                  dnsRecord:
                    description: DNSRecord is the TXT record to add at the domain's
                      DNS provider.
                    properties:
                      content:
                        description: Content is the value the record must hold.
                        type: string
                      name:
                        description: |-
                          Name is the fully qualified record name, such as
                          _milo-verification.acme.com.
                        type: string
                      type:
                        description: Type is the record type. It is always TXT.
                        type: string
                    required:
                    - content
                    - name
                    - type
                    type: object
                  lastAttemptTime:
                    description: LastAttemptTime is when Milo last looked for the
                      record.
                    format: date-time
                    type: string
                  nextAttemptTime:
                    description: NextAttemptTime is when Milo will look for the record
                      again.
                    format: date-time
                    type: string
                required:
                - dnsRecord
                type: object
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.domainName
    served: true
    storage: true
    subresources:
      status: {}
