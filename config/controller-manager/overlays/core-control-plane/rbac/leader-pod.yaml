# The leader marks its own pod with a deletion cost, so a rollout deletes the
# standby's pod first. Pod names are generated, so the rule cannot name it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: milo-controller-manager-leader-pod
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: milo-controller-manager-leader-pod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: milo-controller-manager-leader-pod
subjects:
  - kind: ServiceAccount
    name: milo-controller-manager
    namespace: milo-system
