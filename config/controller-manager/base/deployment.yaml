apiVersion: apps/v1
kind: Deployment
metadata:
  name: milo-controller-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: milo-controller-manager
      app.kubernetes.io/part-of: milo-control-plane
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milo-controller-manager
        app.kubernetes.io/part-of: milo-control-plane
    spec:
      automountServiceAccountToken: false
      containers:
      - name: milo-controller-manager
        image: ghcr.io/milo-os/milo:latest
        imagePullPolicy: IfNotPresent
        args:
          - controller-manager
          - --leader-elect=true
          - --leader-elect-lease-duration=15s
          - --leader-elect-renew-deadline=10s
          - --leader-elect-retry-period=2s
          - --leader-elect-resource-namespace=$(LEADER_ELECT_RESOURCE_NAMESPACE)
          - --authentication-skip-lookup
          - --client-ca-file=$(CLIENT_CA_FILE)
          - --secure-port=6443
          - --kubeconfig=$(KUBECONFIG)
          - --infra-cluster-kubeconfig=$(INFRA_CLUSTER_KUBECONFIG)
          - --cert-dir=$(CERT_DIR)
          - --tls-cert-file=$(TLS_CERT_FILE)
          - --tls-private-key-file=$(TLS_PRIVATE_KEY_FILE)
          - --logging-format=$(LOGGING_FORMAT)
          - --v=$(LOG_LEVEL)
          - --control-plane-scope=$(CONTROL_PLANE_SCOPE)
          # Feature gates controlled via FEATURE_GATES env var.
          # Enable unified organizations: FEATURE_GATES=UnifiedOrganizations=true
          - --feature-gates=$(FEATURE_GATES)
          - --project-suspension-retention-window-days=$(PROJECT_SUSPENSION_RETENTION_WINDOW_DAYS)
          - --project-suspension-notification-days=$(PROJECT_SUSPENSION_NOTIFICATION_DAYS)
          - --project-suspension-deletion-warning-email-template=$(PROJECT_SUSPENSION_DELETION_WARNING_EMAIL_TEMPLATE)
          - --project-suspension-deletion-warning-email-namespace=$(PROJECT_SUSPENSION_DELETION_WARNING_EMAIL_NAMESPACE)
          - --project-suspension-warning-excluded-reasons=$(PROJECT_SUSPENSION_WARNING_EXCLUDED_REASONS)
        env:
          - name: FEATURE_GATES
            value: ""
          - name: LEADER_ELECT_RESOURCE_NAMESPACE
            value: milo-system
          # Default to INFO level logging
          - name: LOG_LEVEL
            value: "4"
          - name: LOGGING_FORMAT
            value: "json"
          - name: KUBECONFIG
            value: /etc/kubernetes/config/kubeconfig
          # Default to using the in-cluster config to connect to the
          # infrastructure cluster.
          - name: INFRA_CLUSTER_KUBECONFIG
            value: "-"
          - name: CERT_DIR
            value: /etc/kubernetes/pki/webhook
          - name: TLS_CERT_FILE
            value: /etc/kubernetes/pki/webhook/tls.crt
          - name: TLS_PRIVATE_KEY_FILE
            value: /etc/kubernetes/pki/webhook/tls.key
          - name: CLIENT_CA_FILE
            value: /etc/kubernetes/pki/webhook/ca.crt
          - name: CONTROL_PLANE_SCOPE
            value: "core"
          # How many days a project may remain suspended before it is
          # automatically deleted.
          - name: PROJECT_SUSPENSION_RETENTION_WINDOW_DAYS
            value: "90"
          # Days-until-deletion thresholds at which a warning e-mail is sent,
          # in addition to the notice sent immediately upon suspension.
          - name: PROJECT_SUSPENSION_NOTIFICATION_DAYS
            value: "60,30,15,7,3,1"
          - name: PROJECT_SUSPENSION_DELETION_WARNING_EMAIL_TEMPLATE
            value: emailtemplates.notification.miloapis.com-projectsuspensiondeletionwarningemailtemplate
          # Namespace suspension deletion warning Email resources are
          # created in, kept as a stable, centralized audit trail.
          - name: PROJECT_SUSPENSION_DELETION_WARNING_EMAIL_NAMESPACE
            value: milo-system
          # Suspension reasons for which countdown deletion warning e-mails
          # are NOT sent. Projects suspended for these reasons still auto-delete
          # after the retention window; only the warning e-mail is suppressed.
          - name: PROJECT_SUSPENSION_WARNING_EXCLUDED_REASONS
            value: "Fraud,Abuse"
          # Soft memory limit tracking the cgroup cap so GC reclaims before
          # OOMKill (#631).
          - name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                containerName: milo-controller-manager
                resource: limits.memory
                divisor: "1"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 6443
          name: https
          protocol: TCP
        # The controller manager webhook is exposed on a separate port than the
        # webhook server provided by the k8s native controller webhooks so we
        # can leverage the controller runtime library to manage and implement
        # webhooks.
        - containerPort: 9443
          name: ctrl-mgr
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
      restartPolicy: Always
