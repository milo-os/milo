apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: quota.miloapis.com-resourceregistration
spec:
  serviceRef:
    name: "quota.miloapis.com"
  kind: ResourceRegistration
  plural: resourceregistrations
  singular: resourceregistration
  subresources:
    - name: status
      permissions:
        - get
        - update
        - patch
  permissions:
    - list
    - get
    - create
    - update
    - delete
    - patch
    - watch
