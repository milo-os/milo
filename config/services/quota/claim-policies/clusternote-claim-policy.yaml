apiVersion: quota.miloapis.com/v1alpha1
kind: ClaimCreationPolicy
metadata:
  name: project-clusternote-claim-policy
  labels:
    app.kubernetes.io/name: milo
    app.kubernetes.io/component: quota-system
spec:
  trigger:
    resource:
      apiVersion: notes.miloapis.com/v1alpha1
      kind: ClusterNote
    # Only notes about project-scoped subjects count against a project's note
    # quota. Notes about platform-scoped subjects (Contact, User, Organization)
    # have no owning project, so path-derived consumer resolution in the quota
    # admission plugin cannot name a consumer for them and the claim would be
    # rejected against this registration's required Project consumer type.
    # Excluding them here means no claim is created and the note is admitted.
    constraints:
      - expression: "!(trigger.spec.subjectRef.apiGroup in ['notification.miloapis.com', 'iam.miloapis.com', 'resourcemanager.miloapis.com'])"
  target:
    resourceClaimTemplate:
      metadata:
        name: "clusternote-{{ trigger.metadata.name }}"
        namespace: "{{requestInfo.namespace}}"
        labels:
          app.kubernetes.io/name: milo
          app.kubernetes.io/component: quota-system
        annotations:
          kubernetes.io/description: "Automatic quota claim for ClusterNote creation"
      spec:
        requests:
          - resourceType: notes.miloapis.com/notes
            amount: 1
