# Lets a caller assert the project event identity and a Project parent
# context, and nothing broader: one user name, and only the Project value for
# parent-type. parent-name cannot be narrowed, since the controller emits for
# every project.
#
# The access-review rules let the controller manager check, every 10 minutes,
# that Milo still allows the emit (see CheckAccess in
# internal/controllers/resourcemanager/project_event_access.go).
#
# No binding ships with this role. Datum's controller manager connects to Milo
# as system:masters, which can already impersonate. A deployment whose
# controller manager uses a narrower identity binds that identity to this
# role. If --project-event-user is changed, change the users resourceNames to
# match.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resourcemanager.miloapis.com:project-event-impersonator
rules:
  - apiGroups:
      - ""
    resources:
      - users
    resourceNames:
      - system:milo:project-event-emitter
    verbs:
      - impersonate
  - apiGroups:
      - authentication.k8s.io
    resources:
      - userextras/iam.miloapis.com/parent-type
    resourceNames:
      - Project
    verbs:
      - impersonate
  - apiGroups:
      - authentication.k8s.io
    resources:
      - userextras/iam.miloapis.com/parent-name
    verbs:
      - impersonate
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectaccessreviews
      - subjectaccessreviews
    verbs:
      - create
