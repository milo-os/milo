# SPDX-License-Identifier: AGPL-3.0-only
#
# Design principles:
# - A user's Activity feed (user-scoped activity query) shows what they did AND
#   what happened to their own User. The platform creates Users and manages
#   passkeys on the user's behalf, so those arrive as Kubernetes Events from
#   auth-provider-zitadel rather than as audit entries made by the user.
# - Specific rules come before the generic ones they would otherwise fall into:
#   evaluation stops at the first match.
# - Audit rules exclude system actors to keep controller reconciliation out of
#   the feed.

apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: iam.miloapis.com-user
spec:
  resource:
    apiGroup: iam.miloapis.com
    kind: User

  auditRules:
    - name: create-with-email
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.requestObject.spec) && has(audit.requestObject.spec.email)"
      summary: "{{ actor }} created user {{ audit.requestObject.spec.email }}"

    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} created user {{ audit.objectRef.name }}"

    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} deleted user {{ audit.objectRef.name }}"

    # Name changes. The portal's profile form patches givenName and familyName
    # together (with email), and the audit entry carries only the new values, so
    # the summary states the name the user now has rather than claiming a change
    # (a profile save that keeps the same name still reads "updated their name").
    #
    # Guards:
    # - type(...) == map first: for a JSON Patch the request body is a list, and
    #   has() on a list errors, which drops the event instead of falling through.
    # - Both names must be strings: a merge patch can null one or send only one,
    #   and those writes fall through to the generic update rule.
    - name: update-own-name
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && has(audit.user.uid) && audit.user.uid == audit.objectRef.name && type(audit.requestObject) == map && has(audit.requestObject.spec) && type(audit.requestObject.spec) == map && has(audit.requestObject.spec.givenName) && has(audit.requestObject.spec.familyName) && type(audit.requestObject.spec.givenName) == string && type(audit.requestObject.spec.familyName) == string"
      summary: "{{ actor }} updated their name to {{ audit.requestObject.spec.givenName }} {{ audit.requestObject.spec.familyName }}"

    - name: update-name
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && type(audit.requestObject) == map && has(audit.requestObject.spec) && type(audit.requestObject.spec) == map && has(audit.requestObject.spec.givenName) && has(audit.requestObject.spec.familyName) && type(audit.requestObject.spec.givenName) == string && type(audit.requestObject.spec.familyName) == string"
      summary: "{{ actor }} updated the name of user {{ link(audit.objectRef.name, audit.objectRef) }} to {{ audit.requestObject.spec.givenName }} {{ audit.requestObject.spec.familyName }}"

    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated user {{ link(audit.objectRef.name, audit.objectRef) }}"

  # Events recorded by auth-provider-zitadel against the user's User. The
  # reasons are a contract with that service (internal/userprovision/events.go):
  # renaming one there drops its activity here. Each rule also pins the
  # reporting controller, so another component emitting an Event with the same
  # reason can't write into a user's Activity feed.
  eventRules:
    - name: account-created
      match: "event.reason == 'AccountCreated' && event.reportingController == 'auth-provider-zitadel'"
      summary: "Account created"

    - name: passkey-enrolled
      match: "event.reason == 'PasskeyEnrolled' && event.reportingController == 'auth-provider-zitadel'"
      summary: "{{ event.note }}"

    - name: passkey-removed
      match: "event.reason == 'PasskeyRemoved' && event.reportingController == 'auth-provider-zitadel'"
      summary: "{{ event.note }}"
