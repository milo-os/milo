apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The owner the activity processor reads to route a failing policy's alerts.
# iam.miloapis.com is served by Milo's API server, which the platform's
# service catalog places under the control-plane service, team platform.
labels:
  - pairs:
      meta.datumapis.com/service: control-plane
      meta.datumapis.com/team: platform

resources:
  - user-policy.yaml
  - role-policy.yaml
  - group-policy.yaml
  - groupmembership-policy.yaml
  - policybinding-policy.yaml
  - serviceaccount-policy.yaml
  - userinvitation-policy.yaml
  - userdeactivation-policy.yaml
  - platforminvitation-policy.yaml
  - platformaccessapproval-policy.yaml
  - platformaccessrejection-policy.yaml
