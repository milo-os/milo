# SPDX-License-Identifier: AGPL-3.0-only

# ActivityPolicy for GroupMembership resources.
# Defines how GroupMembership API operations appear in activity timelines.
#
# Audit rules handle CRUD operations captured by the Kubernetes API server audit log.
# No eventRules — the controller sets conditions but does not emit Kubernetes Events.
#
# Design principles:
# - Prefer the member's email from the iam.miloapis.com/user-email annotation,
#   stamped by the GroupMembership mutating webhook at admission and kept in
#   sync by the GroupMembership controller; fall back to spec.userRef.name
#   (the User name) when the annotation is absent
# - Rules are listed most-specific first, and the annotation rules also match
#   strictly more narrowly than the userRef rules, so the same rule wins
#   regardless of evaluation order
# - Use spec.groupRef.name for the group
# - Human-readable phrasing: "added X to group Y", "removed X from group Y"
# - Read the resource from audit.responseObject for both create and delete
# - Exclude system actors to reduce reconciliation noise
#
# IMPORTANT: audit.requestObject is recorded before admission, so on CREATE it holds
# only what the client sent: never the webhook-stamped email, and possibly a
# client-forged one. audit.responseObject is the stored object after mutation
# (iam.miloapis.com is audited at RequestResponse level). For DELETE,
# requestObject is a DeleteOptions, not the resource.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: iam.miloapis.com-groupmembership
spec:
  resource:
    apiGroup: iam.miloapis.com
    kind: GroupMembership

  auditRules:
    - name: create-with-email
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseObject.spec) && has(audit.responseObject.spec.userRef) && has(audit.responseObject.spec.groupRef) && has(audit.responseObject.metadata.annotations) && 'iam.miloapis.com/user-email' in audit.responseObject.metadata.annotations"
      summary: "{{ actor }} added {{ audit.responseObject.metadata.annotations['iam.miloapis.com/user-email'] }} to group {{ audit.responseObject.spec.groupRef.name }}"

    - name: create-with-userref
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseObject.spec) && has(audit.responseObject.spec.userRef) && has(audit.responseObject.spec.groupRef)"
      summary: "{{ actor }} added {{ audit.responseObject.spec.userRef.name }} to group {{ audit.responseObject.spec.groupRef.name }}"

    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} added a member to the group"

    - name: delete-with-email
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseObject.spec) && has(audit.responseObject.spec.userRef) && has(audit.responseObject.spec.groupRef) && has(audit.responseObject.metadata.annotations) && 'iam.miloapis.com/user-email' in audit.responseObject.metadata.annotations"
      summary: "{{ actor }} removed {{ audit.responseObject.metadata.annotations['iam.miloapis.com/user-email'] }} from group {{ audit.responseObject.spec.groupRef.name }}"

    - name: delete-with-userref
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseObject.spec) && has(audit.responseObject.spec.userRef) && has(audit.responseObject.spec.groupRef)"
      summary: "{{ actor }} removed {{ audit.responseObject.spec.userRef.name }} from group {{ audit.responseObject.spec.groupRef.name }}"

    - name: delete-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} removed a member from the group"

    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated group membership {{ link(audit.objectRef.name, audit.objectRef) }}"
