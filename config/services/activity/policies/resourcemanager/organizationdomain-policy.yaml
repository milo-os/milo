# ActivityPolicy for OrganizationDomain resources.
# Defines how OrganizationDomain API operations appear in activity timelines.
#
# An OrganizationDomain is named after its domain, so audit.objectRef.name is
# the domain for every verb, including delete, where audit.requestObject is a
# DeleteOptions. No eventRules: the controller sets the Verified condition but
# does not emit Kubernetes Events.
#
# All rules exclude system actors so controller reconciliation doesn't
# generate activity noise.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: resourcemanager.miloapis.com-organizationdomain
spec:
  resource:
    apiGroup: resourcemanager.miloapis.com
    kind: OrganizationDomain

  auditRules:
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} added the domain {{ audit.objectRef.name }} to the organization"

    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} removed the domain {{ audit.objectRef.name }} from the organization"

    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated the domain {{ link(audit.objectRef.name, audit.objectRef) }}"
