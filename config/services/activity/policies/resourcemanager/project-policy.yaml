# ActivityPolicy for Project resources.
# Defines how Project API operations appear in activity timelines.
#
# Audit rules handle CRUD operations captured by the Kubernetes API server audit log.
# eventRules handle control-plane events emitted on Project state transitions.
#
# Design principles:
# - Use the project name as display text
# - Action-oriented language ("created project", "deleted project", "was suspended")
# - Exclude system actors to reduce reconciliation noise
#
# eventRules for Suspended/Reinstated use event.regarding.name and
# event.note (the events.k8s.io/v1 CEL contract exposes the Kubernetes
# Event's involved object as `regarding`, not `involvedObject`, and its
# message as `note`, not `message` — see datum-cloud/activity
# internal/cel/environment.go). The controller crafts that note to be
# consumer-safe: it names the suspension reason CATEGORY (e.g. "Abuse") but
# never the ProjectSuspension resource name, requestedBy, or description,
# which are internal admin detail.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: resourcemanager.miloapis.com-project
spec:
  resource:
    apiGroup: resourcemanager.miloapis.com
    kind: Project

  # Audit log rules for CRUD operations.
  # All rules exclude system components (!audit.user.username.startsWith('system:'))
  # so controller reconciliation doesn't generate activity noise.
  auditRules:
    - name: create
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300"
      summary: "{{ actor }} created project {{ has(audit.responseObject.metadata.name) ? link(audit.responseObject.metadata.name, audit.objectRef) : has(audit.objectRef.name) ? link(audit.objectRef.name, audit.objectRef) : (has(audit.responseObject.details) && has(audit.responseObject.details.name)) ? link(audit.responseObject.details.name, audit.objectRef) : link('a project', audit.objectRef) }}"

    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} deleted project {{ audit.objectRef.name }}"

    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated project {{ link(audit.objectRef.name, audit.objectRef) }}"

  eventRules:
    - name: suspended
      match: "event.reason == 'Suspended'"
      summary: "Project {{ event.regarding.name }} was suspended (category: {{ event.note }})"

    - name: reinstated
      match: "event.reason == 'Reinstated'"
      summary: "Project {{ event.regarding.name }} was reinstated"
