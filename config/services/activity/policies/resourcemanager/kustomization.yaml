apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The owner the activity processor reads to route a failing policy's alerts.
# resourcemanager.miloapis.com is served by Milo's API server, which the platform's
# service catalog places under the control-plane service, team platform.
labels:
  - pairs:
      meta.datumapis.com/service: control-plane
      meta.datumapis.com/team: platform

resources:
  - organization-policy.yaml
  - project-policy.yaml
  - organizationmembership-policy.yaml
  - organizationdomain-policy.yaml
  - projectsuspension-policy.yaml
