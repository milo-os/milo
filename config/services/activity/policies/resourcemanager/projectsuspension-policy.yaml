# ActivityPolicy for ProjectSuspension resources.
# Defines how ProjectSuspension API operations appear in activity timelines.
#
# Audit rules handle CRUD operations captured by the Kubernetes API server audit log.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: resourcemanager.miloapis.com-projectsuspension
spec:
  resource:
    apiGroup: resourcemanager.miloapis.com
    kind: ProjectSuspension

  # Audit log rules for CRUD operations.
  # All rules exclude system components (!audit.user.username.startsWith('system:'))
  # so controller reconciliation doesn't generate activity noise.
  auditRules:
    # Create with project and reason
    - name: create-with-project-and-reason
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseObject.spec) && has(audit.responseObject.spec.projectRef) && has(audit.responseObject.spec.projectRef.name) && has(audit.responseObject.spec.reason)"
      summary: "{{ actor }} suspended project {{ audit.responseObject.spec.projectRef.name }} (reason: {{ audit.responseObject.spec.reason }})"

    # Create fallback
    - name: create-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create'"
      summary: "{{ actor }} created suspension {{ audit.objectRef.name }}"

    # Delete with project reference
    - name: delete-with-project
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseObject.spec) && has(audit.responseObject.spec.projectRef) && has(audit.responseObject.spec.projectRef.name)"
      summary: "{{ actor }} deleted suspension {{ audit.objectRef.name }} for project {{ audit.responseObject.spec.projectRef.name }}"

    # Delete fallback
    - name: delete-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete'"
      summary: "{{ actor }} deleted suspension {{ audit.objectRef.name }}"

    # Generic update
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource)"
      summary: "{{ actor }} updated suspension {{ link(audit.objectRef.name, audit.objectRef) }}"
