apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resourcemanager-projectsuspensions
  labels:
    app.kubernetes.io/name: milo
    app.kubernetes.io/component: resourcemanager-system
    app.kubernetes.io/part-of: milo
    monitoring.coreos.com/prometheus: kube-prometheus
spec:
  groups:
    - name: resourcemanager.projectsuspensions
      rules:
        - alert: ProjectSuspensionNotReady
          expr: |
            milo_projectsuspensions_info{phase!="Lifted"} == 1
            and on(project) label_replace(
              milo_projects_status_condition{type="Suspended"} == 0,
              "project", "$1", "resource_name", "(.*)"
            )
          for: 5m
          labels:
            severity: warning
            category: readiness
            team: platform
            service: milo
          annotations:
            runbook_url: "https://github.com/milo-os/milo/blob/main/docs/runbooks/project-suspension-not-ready.md"
            summary: "Project suspension {{ $labels.resource_name }} is not ready"
            description: |
              An active ProjectSuspension has been declared for project {{ $labels.project }}, but the project status condition 'Suspended' has remained False for over 5 minutes.
              
              Project: {{ $labels.project }}
              Suspension name: {{ $labels.resource_name }}
              Reason: {{ $labels.reason }}
              
              Actions needed:
              1. Check controller logs for propagation errors: kubectl logs -n milo-system -l app.kubernetes.io/component=controller-manager
              2. Inspect the project condition status: kubectl get project {{ $labels.project }} -o yaml

        - alert: ProjectReinstatementFailed
          expr: |
            milo_projects_status_condition{type="Suspended"} == 1
            unless on(resource_name) label_replace(
              milo_projectsuspensions_info{phase!="Lifted"} == 1,
              "resource_name", "$1", "project", "(.*)"
            )
          for: 5m
          labels:
            severity: warning
            category: readiness
            team: platform
            service: milo
          annotations:
            runbook_url: "https://github.com/milo-os/milo/blob/main/docs/runbooks/project-reinstatement-failed.md"
            summary: "Project {{ $labels.resource_name }} failed to reinstate"
            description: |
              Project {{ $labels.resource_name }} is marked as Suspended, but there are no active ProjectSuspension resources targeting it.
              The project is stuck in the suspended state and has failed to return to Active.
              
              Project: {{ $labels.resource_name }}
              
              Actions needed:
              1. Check controller logs for propagation/reinstatement errors: kubectl logs -n milo-system -l app.kubernetes.io/component=controller-manager
              2. Verify target project status conditions manually: kubectl get project {{ $labels.resource_name }} -o yaml


        # The controller logs an emit failure and moves on, so a missing grant in Milo would otherwise drop every
        # Suspended and Reinstated event without notice. Suspensions are rare, so one failure is worth a look. Each
        # reason's series starts at 0, so increase() sees the first failure.
        - alert: ProjectLifecycleEventEmitFailed
          expr: |
            sum by (reason) (increase(milo_resourcemanager_project_lifecycle_event_emit_failed_total[30m])) > 0
          labels:
            severity: warning
            category: events
            team: platform
            service: milo
          annotations:
            runbook_url: "https://github.com/milo-os/milo/blob/main/docs/runbooks/project-lifecycle-event-emit-failed.md"
            summary: "Project {{ $labels.reason }} events are failing to reach Milo"
            description: "The controller manager failed to create {{ $value | humanize }} Project {{ $labels.reason }} event(s) in the last 30 minutes. Tenants do not see these suspensions or reinstatements in their activity feed."

        # Every controller manager replica asks Milo every 10 minutes whether it may emit as its --project-event-user.
        # The flag ships to the hosting cluster and the RBAC ships to Milo, so a changed flag or a missing binding shows
        # up here before the next suspension does. The 30m window covers a fresh install, where Milo's RBAC can land
        # after the controller manager starts.
        - alert: ProjectEventUserUnauthorized
          expr: |
            milo_resourcemanager_project_event_user_authorized == 0
          for: 30m
          labels:
            severity: warning
            category: events
            team: platform
            service: milo
          annotations:
            runbook_url: "https://github.com/milo-os/milo/blob/main/docs/runbooks/project-event-user-unauthorized.md"
            summary: "The controller manager cannot emit Project lifecycle events in Milo"
            description: "Controller manager pod {{ $labels.pod }} reports that Milo refuses its project event user {{ $labels.user }}. Suspended and Reinstated events will not reach tenant activity feeds until the --project-event-user flag and Milo's project-events RBAC agree."
