apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: organizationmembership-editor
  annotations:
    kubernetes.io/display-name: Organization Membership Editor
    kubernetes.io/description: "Edit organization membership resources"
spec:
  launchStage: Beta
  inheritedRoles:
    - name: organizationmembership-reader
  includedPermissions:
    - resourcemanager.miloapis.com/organizationmemberships.update
    - resourcemanager.miloapis.com/organizationmemberships.patch
    - resourcemanager.miloapis.com/organizationmemberships.delete