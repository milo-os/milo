name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      skip: test
      run: |
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@32759fab31191897ae86091d8831b2d4b890aedd
        export KUBEBUILDER_ASSETS="$("$(go env GOPATH)/bin/setup-envtest" use 1.37.0 -p path)"
        go test ./... -timeout 10m
