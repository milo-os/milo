name: "Verify Generated Code"
on:
  pull_request:

jobs:
  verify-generate:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install dependencies
        run: go mod download

      - name: Verify generated code
        env:
          TASK_X_REMOTE_TASKFILES: 1
        run: task generate:verify
