name: "IAM API testing"
on:
  push:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

jobs:
  iam_integration_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install dependencies
        run: go mod download
      - name: Install envtest API server
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25 use 1.37.0 -p path)" >> "$GITHUB_ENV"
      - name: Run IAM tests
        run: go test -timeout 5m ./...
