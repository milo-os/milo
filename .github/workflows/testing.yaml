name: "IAM API testing"
on:
  push:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  iam_integration_tests:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install dependencies
        run: go mod download
      - name: Install envtest API server
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25 use 1.37.0 -p path)" >> "$GITHUB_ENV"
      - name: Run IAM tests
        run: go test -timeout 5m ./...
