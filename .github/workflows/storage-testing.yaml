name: "Storage testing"
on:
  push:
    paths:
      - 'pkg/storage/**'
      - 'go.mod'
      - 'go.sum'
      - 'config/dependencies/cockroachdb/**'
      - '.github/workflows/storage-testing.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  cockroachdb_storage_tests:
    # The tests start CockroachDB in Docker, so the job needs a runner that
    # provides it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group-commit: [on, off]
    name: cockroachdb_storage_tests (group commit ${{ matrix.group-commit }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Run CockroachDB storage tests
        env:
          # Fail instead of skipping when the tests can't start CockroachDB.
          MILO_COCKROACH_TEST_REQUIRE: "1"
          MILO_COCKROACH_TEST_NO_GROUP_COMMIT: ${{ matrix.group-commit == 'off' && '1' || '' }}
        run: go test -race -timeout 10m ./pkg/storage/cockroach/
