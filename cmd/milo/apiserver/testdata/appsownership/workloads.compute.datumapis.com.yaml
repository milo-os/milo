                                type: object
                            type: object
                          sandbox:
                            description: A sandbox is a managed isolated environment
                              capable of running containers.
                            properties:
                              containers:
                                description: A list of containers to run within the
                                  sandbox.
                                items:
                                  properties:
                                    args:
                                      description: |-
                                        Arguments to the entrypoint, overriding the image's CMD. Combined with
