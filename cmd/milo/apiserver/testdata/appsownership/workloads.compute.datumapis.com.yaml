      type: string
    - jsonPath: .status.updatedReplicas
      name: Up-to-date
      type: string
    name: v1alpha
    schema:
      openAPIV3Schema:
        description: Workload is the Schema for the workloads API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkloadSpec defines the desired state of Workload
            properties:
              placements:
                description: |-
                  Defines where instances should be deployed, and at what scope a deployment
                  will live in, such as in a city, or region.
                items:
                  properties:
                    cityCodes:
                      description: |-
                        The city codes this placement was written against before placement
                        moved to locations. This field is deprecated and kept only so workloads
                        stored before that change keep running: admission and the workload
                        controller rewrite it into a locationSelector on
                        topology.datum.net/city-code, which places at every location in those
                        cities, and clear it. New workloads set locations or locationSelector
                        instead.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    locationSelector:
                      description: |-
                        A selector over the topology of the locations available to the project,
                        such as topology.datum.net/city-code or topology.datum.net/region. Every
                        Ready location whose topology matches receives a deployment, and the set
                        is re-evaluated as locations are added, removed, or change readiness. An
                        empty selector is rejected rather than treated as matching every
                        location. Exactly one of locations or locationSelector must be set.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    locations:
                      description: |-
                        The locations where the instances should be deployed, by name. Use this
                        to pin a placement to specific locations. Exactly one of locations or
                        locationSelector must be set.
                      items:
                        properties:
                          name:
                            description: Name of a datum location
                            type: string
                        required:
                        - name
                        type: object
                      minItems: 1
                      type: array
                    name:
                      description: The name of the placement
                      type: string
                    scaleSettings:
                      description: Scale settings such as minimum and maximum replica
                        counts.
                      properties:
                        instanceManagementPolicy:
                          default: OrderedReady
                          description: |-
                            Controls how instances are managed during scale up and down, as well as
                            during maintenance events.
                          type: string
                        maxReplicas:
                          description: The maximum number of replicas.
                          format: int32
                          type: integer
                        metrics:
                          description: A list of metrics that determine scaling behavior,
                            such as external metrics.
                          items:
                            properties:
                              resource:
                                description: Resource metrics known to Datum.
                                properties:
                                  name:
                                    description: The name of the resource in question.
                                    type: string
                                  target:
                                    description: The target value for the given metric
                                    properties:
                                      averageUtilization:
                                        description: |-
                                          The target value of the average of the
                                          resource metric across all relevant instances, represented as a percentage of
                                          the requested value of the resource for the instances.
                                        format: int32
                                        type: integer
                                      averageValue:
                                        anyOf:
                                        - type: integer
                                        - type: string
                                        description: |-
                                          The target value of the average of the metric across all relevant instances
                                          (as a quantity)
                                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                        x-kubernetes-int-or-string: true
                                      value:
                                        anyOf:
                                        - type: integer
                                        - type: string
                                        description: The target value of the metric
                                          (as a quantity).
                                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                        x-kubernetes-int-or-string: true
                                    type: object
                                required:
                                - name
                                - target
                                type: object
                            type: object
                          type: array
                        minReplicas:
                          description: The minimum number of replicas.
                          format: int32
                          type: integer
                      required:
                      - instanceManagementPolicy
                      - minReplicas
                      type: object
                  required:
                  - name
                  - scaleSettings
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of locations, locationSelector, or cityCodes
                      must be set
                    rule: '(has(self.locations) ? 1 : 0) + (has(self.locationSelector)
                      ? 1 : 0) + (has(self.cityCodes) ? 1 : 0) == 1'
