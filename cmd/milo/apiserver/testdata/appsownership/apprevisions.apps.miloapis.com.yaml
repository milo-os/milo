apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apprevisions.apps.miloapis.com
  annotations:
    discovery.miloapis.com/parent-contexts: Project
spec:
  group: apps.miloapis.com
  scope: Cluster
  names:
    plural: apprevisions
    singular: apprevision
    kind: AppRevision
    listKind: AppRevisionList
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              projectUID:
                type: string
                minLength: 1
                maxLength: 256
                pattern: ^[^\s]+$
              appName:
                type: string
                minLength: 1
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
              appUID:
                type: string
                minLength: 1
                maxLength: 256
                pattern: ^[^\s]+$
              admittedGeneration:
                type: integer
                format: int64
                minimum: 1
              sequence:
                type: integer
                format: int64
                minimum: 1
              previousRevision:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[^\s]+$
                required:
                - name
                - uid
              effectiveActorUID:
                type: string
                minLength: 1
                maxLength: 256
                pattern: ^[^\s]+$
              acceptedAt:
                type: string
                format: date-time
              source:
                type: string
                enum:
                - Create
                - Update
                - Rollback
              rollbackFrom:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[^\s]+$
                required:
                - name
                - uid
              desiredSpec:
                type: object
                properties:
                  templateRef:
                    type: object
                    properties:
                      projectRevision:
                        type: object
                        properties:
                          projectUID:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\s]+$
                          templateName:
                            type: string
                            minLength: 1
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                          templateUID:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\s]+$
                          revisionName:
                            type: string
                            minLength: 1
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                          revisionUID:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\s]+$
                          digest:
                            type: string
                            minLength: 71
                            maxLength: 71
                            pattern: ^sha256:[0-9a-f]{64}$
                        required:
                        - projectUID
                        - templateName
                        - templateUID
                        - revisionName
                        - revisionUID
                        - digest
                      publishedVersion:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                          uid:
                            type: string
                            minLength: 1
                            maxLength: 256
                            pattern: ^[^\s]+$
                          digest:
                            type: string
                            minLength: 71
                            maxLength: 71
                            pattern: ^sha256:[0-9a-f]{64}$
                        required:
                        - name
                        - uid
                        - digest
                    x-kubernetes-validations:
                    - rule: has(self.projectRevision) != has(self.publishedVersion)
                      message: select exactly one immutable template snapshot
                  inputsJSON:
                    type: string
                    minLength: 2
                    maxLength: 262144
                  inputsDigest:
                    type: string
                    minLength: 71
                    maxLength: 71
                    pattern: ^sha256:[0-9a-f]{64}$
                  uninstallPolicy:
                    type: string
                    enum:
                    - Delete
                    - Retain
                required:
                - templateRef
                - inputsJSON
                - inputsDigest
                - uninstallPolicy
              specDigest:
                type: string
                minLength: 71
                maxLength: 71
                pattern: ^sha256:[0-9a-f]{64}$
            required:
            - projectUID
            - appName
            - appUID
            - admittedGeneration
            - sequence
            - effectiveActorUID
            - acceptedAt
            - source
            - desiredSpec
            - specDigest
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: accepted App revision is immutable
            - rule: 'self.sequence == 1 ? self.source == ''Create'' && !has(self.previousRevision)
                : self.source != ''Create'' && has(self.previousRevision)'
              message: sequence and previous revision must match source
            - rule: 'self.source == ''Rollback'' ? has(self.rollbackFrom) : !has(self.rollbackFrom)'
              message: rollback requires exactly one source revision
            - rule: '!has(self.desiredSpec.templateRef.projectRevision) || self.desiredSpec.templateRef.projectRevision.projectUID
                == self.projectUID'
              message: local revision must belong to the same Project
        required:
        - spec
